name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, mbstring, ctype
          tools: composer:v2
      - name: Install backend dependencies (locked)
        run: composer install --working-dir=backend --no-interaction --no-progress --prefer-dist
      - name: Check platform requirements
        run: composer check-platform-reqs --working-dir=backend
      - name: PHP lint
        run: |
          php -v
          for f in backend/src/*.php backend/config/*.php contact-submit.php; do php -l "$f"; done
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build File Manager upload packages
        run: python scripts/build_packages.py
      - name: Publish File Manager upload packages
        uses: actions/upload-artifact@v4
        with:
          name: actpsb-cpanel-php${{ matrix.php }}-${{ github.sha }}
          path: |
            dist/actpsb-*.zip
            dist/MANIFEST.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
